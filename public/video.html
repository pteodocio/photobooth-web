<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth Video</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body {
      background-color: #08080B;
      color: #F3F3F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 56, 92, 0.2);
      border-top-color: #FF385C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p style="font-size: 13px; color: rgba(255,255,255,0.6);">Opening photobooth video...</p>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var videoToken = params.get('v');
      var targetUrl = videoToken ? ('/?v=' + encodeURIComponent(videoToken)) : '/';
      window.location.replace(targetUrl);
    })();
  </script>
</body>
</html>
