<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korean 4-Cut Photobooth Strip & Video</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body {
      background-color: #09090C;
      color: #F3F3F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #141419;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 56, 92, 0.2);
      border-top-color: #FF385C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
    }
    a.btn {
      display: inline-block;
      background: #FF385C;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Opening Photobooth Strip...</h1>
    <p>Redirecting you to your photo strip and behind-the-scenes video.</p>
    <a id="directLink" class="btn" href="/">View Strip & Video</a>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var sessionId = params.get('s');
      var targetUrl = sessionId ? ('/?s=' + encodeURIComponent(sessionId)) : '/';
      var link = document.getElementById('directLink');
      if (link) link.href = targetUrl;
      window.location.replace(targetUrl);
    })();
  </script>
</body>
</html>
